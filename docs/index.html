<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Figgity</title>
<style>
  :root {
    --surface: #111827;
    --surface-medium: #374151;
    --on-surface-high: #ffffff;
    --on-surface-medium: #cdd2d8;
    --on-surface-muted: #9ca3af;
    --border: #4b5563;
    --border-subtle: #1f2937;
    --container: #202936;
    --container-medium: #4a5666;
    --on-container-high: #ffffff;
    --on-container-medium: #cdd2d8;
    --container-divider: #4a5666;
    --preview-bg: #ffffff;
    --accent: #58a6ff;
    --btn-primary: #2ba17f;
    --btn-primary-hover: #58cca2;
    --btn-primary-pressed: #1b846c;
    --on-primary: #111827;
    --critical: #6b0f2a;
    --error: #f85149;
    --warning: #d29922;
    --info: #58a6ff;
    --success: #3fb950;
  }
  [data-theme="light"] {
    --surface: #f3f6f8;
    --surface-medium: #d3d1d1;
    --on-surface-high: #191817;
    --on-surface-medium: #443f3f;
    --on-surface-muted: #6b7280;
    --border: #d3d1d1;
    --border-subtle: #e5e7eb;
    --container: #ffffff;
    --container-medium: #e6ebf0;
    --on-container-high: #191817;
    --on-container-medium: #595352;
    --container-divider: #ebeaea;
    --preview-bg: #f3f6f8;
    --accent: #117261;
    --btn-primary: #117261;
    --btn-primary-hover: #1b846c;
    --btn-primary-pressed: #0f5f55;
    --on-primary: #ffffff;
    --error: #dc2626;
    --warning: #b45309;
    --info: #2563eb;
    --success: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--surface); color: var(--on-surface-medium); min-height: 100vh; padding: 2rem 1rem; transition: background 0.2s, color 0.2s; }
  .container { max-width: 1300px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--on-surface-high); }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
  .steps { justify-content: center; }
  .figgy-icon { width: 48px; height: 48px; }
  .subtitle { color: var(--on-surface-medium); font-size: 0.875rem; margin-bottom: 0; }
  .steps { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
  .step { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--on-surface-muted); }
  .step-num { background: var(--border); color: var(--on-surface-high); width: 1.5rem; height: 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; }
  .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all 0.15s; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--surface-medium); }
  .drop-zone p { color: var(--on-surface-muted); margin-top: 0.75rem; font-size: 0.875rem; }
  .drop-zone .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .drop-zone .cta { color: var(--accent); font-weight: 500; font-size: 1rem; }
  input[type="file"] { display: none; }
  .file-list { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .file-chip { background: var(--surface-medium); border: 1px solid var(--border); border-radius: 6px; padding: 0.375rem 0.75rem; font-size: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
  .file-chip .remove { cursor: pointer; color: var(--on-surface-muted); font-weight: bold; }
  .file-chip .remove:hover { color: var(--error); }
  .file-chip.clear-all { background: transparent; border: 1.5px solid var(--critical); color: var(--critical); cursor: pointer; font-weight: 500; border-radius: 100px; padding: 0.375rem 1rem; }
  .file-chip.clear-all:hover { background: var(--critical); border-color: var(--critical); color: #fff; }
  .btn { background: var(--btn-primary); color: var(--on-primary); border: none; border-radius: 100px; padding: 0.625rem 1.5rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; margin-top: 1.5rem; transition: all 0.15s; }
  .btn:hover { background: var(--btn-primary-hover); }
  .btn:active { background: var(--btn-primary-pressed); }
  .btn:disabled { background: #9e9e9e; color: #e0e0e0; cursor: not-allowed; opacity: 0.6; }
  .results { margin-top: 2rem; }
  .result-file { background: var(--container); border: 1px solid var(--container-divider); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .result-file .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .result-file h3 { font-size: 0.875rem; font-weight: 600; color: var(--on-container-high); }
  .result-file.clean h3 { color: var(--on-container-high); }
  .result-file.clean .check { color: var(--success); margin-right: 0.25rem; }
  .msg { padding: 0.75rem 0; border-bottom: 1px solid var(--container-divider); font-size: 0.875rem; }
  .msg:last-child { border-bottom: none; }
  .msg p { margin: 0.25rem 0; }
  .msg strong { color: var(--on-container-high); }
  .msg .severity { display: inline-block; width: 1.25rem; text-align: center; margin-right: 0.5rem; }
  .msg .severity.error { color: var(--error); }
  .msg .severity.warning { color: var(--warning); }
  .msg .severity.info { color: var(--info); }
  .msg .msg-error { color: var(--on-container-high); }
  .msg .msg-rule { color: var(--on-container-medium); padding-left: 1.75rem; }
  .msg .msg-suggestion { color: var(--on-container-medium); padding-left: 1.75rem; }
  .summary { margin-top: 1rem; margin-bottom: 1rem; padding: 0.75rem 1rem; background: var(--container-medium); border: 1px solid var(--container-divider); border-radius: 6px; font-size: 0.875rem; }
  .summary .errors { color: var(--error); }
  .summary .warnings { color: var(--warning); }
  .summary .infos { color: var(--info); }
  .summary .clean { color: var(--success); }
  .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.375rem, 1fr)); gap: 0.75rem; margin-top: 1rem; margin-bottom: 1.5rem; }
  .preview-item { border-radius: 6px; padding: 0.5rem; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .preview-item img { max-width: 100%; max-height: 100%; }
  .preview-item .name { position: absolute; bottom: -1.25rem; left: 0; right: 0; text-align: center; font-size: 0.625rem; color: var(--on-surface-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-code-toggle { background: transparent; border: 1px solid var(--border); border-radius: 100px; padding: 0.25rem 0.75rem; font-size: 0.75rem; color: var(--on-surface-muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn-code-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .code-block { position: relative; }
  .btn-copy { position: absolute; top: 0.75rem; right: 0.75rem; background: var(--surface-medium); border: 1px solid var(--border); border-radius: 6px; padding: 0.25rem 0.5rem; font-size: 0.75rem; color: var(--on-surface-muted); cursor: pointer; display: flex; align-items: center; gap: 0.25rem; transition: all 0.15s; }
  .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
  .btn-copy svg { width: 14px; height: 14px; fill: currentColor; }
  .code-section { margin-top: 2rem; }
  .code-block { background: var(--surface); border: 1px solid var(--container-divider); border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; margin-top: 0.75rem; }
  .code-block h3 { font-size: 0.875rem; font-weight: 600; margin-bottom: 1rem; color: var(--on-container-high); }
  .code-block pre { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Menlo, monospace; font-size: 0.8125rem; line-height: 1.8; color: var(--on-container-medium); white-space: pre; overflow-x: auto; counter-reset: line; }
  .code-block .tag { color: var(--btn-primary); }
  .code-block .attr { color: var(--warning); }
  .code-block .val { color: var(--success); }
  .code-block .bracket { color: var(--on-container-muted, var(--on-surface-muted)); }
  .code-block .line { display: block; }
  .code-block .line::before { counter-increment: line; content: counter(line); display: inline-block; width: 2.5rem; margin-right: 1rem; text-align: right; color: var(--on-surface-muted); opacity: 0.5; font-size: 0.75rem; user-select: none; }
  .code-block .line.error-line { background: rgba(248, 81, 73, 0.1); border-left: 3px solid var(--error); margin-left: -0.5rem; padding-left: 0.5rem; }
  .code-block .line.warning-line { background: rgba(210, 153, 34, 0.1); border-left: 3px solid var(--warning); margin-left: -0.5rem; padding-left: 0.5rem; }
  .theme-switch { position: absolute; top: 1.5rem; right: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .theme-switch span { font-size: 0.875rem; }
  .theme-track { width: 2.75rem; height: 1.5rem; background: var(--surface-medium); border: 1px solid var(--border); border-radius: 100px; position: relative; cursor: pointer; transition: all 0.2s; }
  .theme-track:hover { border-color: var(--accent); }
  .theme-knob { position: absolute; top: 2px; left: 2px; width: 1.125rem; height: 1.125rem; background: var(--btn-primary); border-radius: 50%; transition: transform 0.2s; }
  [data-theme="light"] .theme-knob { transform: translateX(1.25rem); }
</style>
</head>
<body>
<div class="theme-switch"><span>🌙</span><div class="theme-track" id="themeToggle"><div class="theme-knob"></div></div><span>☀️</span></div>
<div class="container">

<div class="title-row">
  <img src="figgy.png" alt="Figgy" class="figgy-icon">
  <div>
    <h1>Figgity</h1>
    <p class="subtitle">Figgy validates your SVGs, no doubt</p>
  </div>
</div>

<div class="steps">
  <div class="step"><span class="step-num">1</span> Upload SVGs</div>
  <div class="step"><span class="step-num">2</span> Check compatibility</div>
</div>

<div class="drop-zone" id="dropZone">
  <div class="icon">📂</div>
  <div class="cta">Drop SVG files here or click to browse</div>
  <p>Accepts .svg files only</p>
</div>
<input type="file" id="fileInput" multiple accept=".svg">

<div class="file-list" id="fileList"></div>
<div class="preview-grid" id="previewGrid"></div>

<button class="btn" id="lintBtn" disabled style="margin-top: 1.5rem;">Check compatibility</button>

<div class="results" id="results"></div>

</div>

<script>
// --- Lint engine (browser bundle) ---

function walkElements(node, callback) {
  if (node.nodeType === 1) callback(node);
  const children = node.childNodes;
  for (let i = 0; i < children.length; i++) walkElements(children[i], callback);
}

function walkWithOpacityContext(node, parentHasOpacity, counter) {
  if (node.nodeType !== 1) return;
  const el = node;
  const opacity = el.getAttribute('opacity');
  const style = el.getAttribute('style') || '';
  const hasOpacity = (opacity !== null && opacity !== '1') || /opacity\s*:\s*(?!1\b)/.test(style);
  if (hasOpacity && parentHasOpacity) counter.count++;
  const children = node.childNodes;
  for (let i = 0; i < children.length; i++) walkWithOpacityContext(children[i], hasOpacity || parentHasOpacity, counter);
}

const rules = [
  {
    id: 'no-filters',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      const tags = ['filter','feGaussianBlur','feDropShadow','feBlend','feColorMatrix','feComponentTransfer','feComposite','feConvolveMatrix','feDiffuseLighting','feDisplacementMap','feFlood','feFuncA','feFuncB','feFuncG','feFuncR','feImage','feMerge','feMergeNode','feMorphology','feOffset','feSpecularLighting','feTile','feTurbulence'];
      for (const tag of tags) {
        const els = doc.getElementsByTagName(tag);
        for (let i = 0; i < els.length; i++) msgs.push({ ruleId:'no-filters', severity:'error', message:`Oh fig no! <${tag}> is not supported by Xcode's CoreSVG renderer`, suggestion:'Filtered assets completely break in CoreSVG; export the file as a vector PDF or an uncompressed PNG scale block instead', element:tag });
      }
      return msgs;
    }
  },
  {
    id: 'no-text-elements',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      for (const tag of ['text','tspan','textPath']) {
        const els = doc.getElementsByTagName(tag);
        for (let i = 0; i < els.length; i++) msgs.push({ ruleId:'no-text-elements', severity:'error', message:`Unbe-leaf-able! <${tag}> renders unformatted serif letters or omits the wording completely in CoreSVG`, suggestion:'Convert all text nodes into permanent outlines/paths in your editor', element:tag });
      }
      return msgs;
    }
  },
  {
    id: 'no-foreign-object',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      const els = doc.getElementsByTagName('foreignObject');
      for (let i = 0; i < els.length; i++) msgs.push({ ruleId:'no-foreign-object', severity:'error', message:"That's a fig-ment of your imagination! <foreignObject> is not supported by CoreSVG", suggestion:'Remove foreignObject elements and use native SVG elements instead', element:'foreignObject' });
      return msgs;
    }
  },
  {
    id: 'no-scripts-animations',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      for (const tag of ['script','animate','animateTransform','animateMotion','set']) {
        const els = doc.getElementsByTagName(tag);
        for (let i = 0; i < els.length; i++) msgs.push({ ruleId:'no-scripts-animations', severity:'error', message:`Don't even fig about it! <${tag}> is not supported in Xcode asset catalogs`, suggestion:'Remove all scripts and animation elements; use static SVGs for asset catalogs', element:tag });
      }
      return msgs;
    }
  },
  {
    id: 'no-embedded-raster',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      const els = doc.getElementsByTagName('image');
      for (let i = 0; i < els.length; i++) {
        const href = els[i].getAttribute('href') || els[i].getAttribute('xlink:href') || '';
        msgs.push({ ruleId:'no-embedded-raster', severity:'error', message:`What the fig! <image> with ${href.startsWith('data:') ? 'embedded base64' : 'external'} source won't render`, suggestion:'Remove embedded raster images; use vector paths or provide raster assets separately', element:'image' });
      }
      return msgs;
    }
  },
  {
    id: 'no-css-styling',
    defaultSeverity: 'warning',
    check(doc) {
      const msgs = [];
      const styles = doc.getElementsByTagName('style');
      for (let i = 0; i < styles.length; i++) msgs.push({ ruleId:'no-css-styling', severity:'warning', message:'Fig-ured this would happen! <style> blocks are stripped by CoreSVG, shapes fallback to solid black', suggestion:'Convert CSS classes into inline path attributes (e.g., <path fill="#ff0000" ... />)', element:'style' });
      walkElements(doc.documentElement, (el) => {
        const style = el.getAttribute('style');
        if (style && (style.includes('var(') || style.includes('@') || style.includes('calc('))) msgs.push({ ruleId:'no-css-styling', severity:'warning', message:`Fig-ured this would happen! Complex CSS (var/calc/@) on <${el.tagName}> is not supported`, suggestion:'Replace CSS functions with static values as presentation attributes', element:el.tagName });
      });
      return msgs;
    }
  },
  {
    id: 'no-blend-modes',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      walkElements(doc.documentElement, (el) => {
        const style = el.getAttribute('style') || '';
        if (style.includes('mix-blend-mode') || style.includes('isolation')) msgs.push({ ruleId:'no-blend-modes', severity:'error', message:`That's a bunch of fig-ments! Blend mode on <${el.tagName}> is ignored by CoreSVG`, suggestion:'Flatten blended layers in your design tool before exporting', element:el.tagName });
      });
      return msgs;
    }
  },
  {
    id: 'no-masks',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      const els = doc.getElementsByTagName('mask');
      for (let i = 0; i < els.length; i++) msgs.push({ ruleId:'no-masks', severity:'error', message:"You're in a jam! <mask> renders uncropped bounding boxes or shapes vanish in CoreSVG", suggestion:'Flatten/merge shapes using a boolean "Subtract" tool in your design editor before export', element:'mask' });
      return msgs;
    }
  },
  {
    id: 'no-complex-clip-paths',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      const els = doc.getElementsByTagName('clipPath');
      for (let i = 0; i < els.length; i++) msgs.push({ ruleId:'no-complex-clip-paths', severity:'error', message:"You're in a jam! <clipPath> renders uncropped bounding boxes or shapes vanish in CoreSVG", suggestion:'Flatten/merge shapes using a boolean "Subtract" tool in your design editor before export', element:'clipPath' });
      return msgs;
    }
  },
  {
    id: 'no-use-refs',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      const els = doc.getElementsByTagName('use');
      for (let i = 0; i < els.length; i++) msgs.push({ ruleId:'no-use-refs', severity:'error', message:"Figgy can't find it! <use> reference trees fail to resolve, leaving empty regions", suggestion:'Use optimization tools (e.g., SVGOMG) to expand clones into explicit paths', element:'use' });
      return msgs;
    }
  },
  {
    id: 'no-unsupported-gradients',
    defaultSeverity: 'warning',
    check(doc) {
      const msgs = [];
      for (const tag of ['linearGradient','radialGradient']) {
        const els = doc.getElementsByTagName(tag);
        for (let i = 0; i < els.length; i++) {
          const spread = els[i].getAttribute('spreadMethod');
          if (spread === 'reflect' || spread === 'repeat') msgs.push({ ruleId:'no-unsupported-gradients', severity:'warning', message:`Ripe for trouble! <${tag}> with spreadMethod="${spread}" is not supported by CoreSVG`, suggestion:'Use spreadMethod="pad" (default) or manually extend gradient stops', element:tag });
        }
      }
      for (const tag of ['mesh','meshrow','meshpatch','meshGradient']) {
        if (doc.getElementsByTagName(tag).length > 0) msgs.push({ ruleId:'no-unsupported-gradients', severity:'warning', message:`Ripe for trouble! <${tag}> (SVG2 mesh gradient) is not supported by CoreSVG`, suggestion:'Replace mesh gradients with standard linear/radial gradients', element:tag });
      }
      return msgs;
    }
  },
  {
    id: 'no-svg2-features',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      for (const tag of ['mesh','meshrow','meshpatch','hatch','hatchpath','solidcolor']) {
        const els = doc.getElementsByTagName(tag);
        for (let i = 0; i < els.length; i++) msgs.push({ ruleId:'no-svg2-features', severity:'error', message:`Not ripe yet! <${tag}> is an SVG 2.0 element CoreSVG doesn't support`, suggestion:'Replace with SVG 1.1 compatible equivalents', element:tag });
      }
      walkElements(doc.documentElement, (el) => {
        if (el.getAttribute('paint-order')) msgs.push({ ruleId:'no-svg2-features', severity:'error', message:`Not ripe yet! paint-order on <${el.tagName}> is an SVG 2.0 feature CoreSVG doesn't support`, suggestion:'Remove paint-order and layer elements manually for desired rendering order', element:el.tagName });
      });
      return msgs;
    }
  },
  {
    id: 'viewbox-consistency',
    defaultSeverity: 'warning',
    check(doc) {
      const msgs = [];
      const svg = doc.documentElement;
      if (!svg || svg.tagName !== 'svg') return msgs;
      const viewBox = svg.getAttribute('viewBox');
      const width = svg.getAttribute('width');
      const height = svg.getAttribute('height');
      if (!viewBox) { msgs.push({ ruleId:'viewbox-consistency', severity:'warning', message:'Fig-ure out your viewBox! SVG is missing a viewBox attribute', suggestion:'Add a viewBox attribute (e.g., viewBox="0 0 24 24") for consistent scaling', element:'svg' }); return msgs; }
      if (!width || !height) msgs.push({ ruleId:'viewbox-consistency', severity:'warning', message:'Fig-ure out your dimensions! SVG has viewBox but missing width/height attributes', suggestion:'Add width and height attributes matching the viewBox dimensions for reliable Xcode rendering', element:'svg' });
      if (width && height && viewBox) {
        const parts = viewBox.split(/[\s,]+/);
        if (parts.length === 4) {
          const vbW = parseFloat(parts[2]), vbH = parseFloat(parts[3]), w = parseFloat(width), h = parseFloat(height);
          if (!isNaN(w) && !isNaN(h) && !isNaN(vbW) && !isNaN(vbH) && Math.abs(w/vbW - h/vbH) > 0.01) msgs.push({ ruleId:'viewbox-consistency', severity:'warning', message:"That's a squished fig! Width/height aspect ratio does not match viewBox", suggestion:'Ensure width/height and viewBox have the same aspect ratio to avoid distortion', element:'svg' });
        }
      }
      return msgs;
    }
  },
  {
    id: 'no-dashed-strokes',
    defaultSeverity: 'info',
    check(doc) {
      const msgs = [];
      walkElements(doc.documentElement, (el) => {
        const da = el.getAttribute('stroke-dasharray');
        const style = el.getAttribute('style') || '';
        if ((da && da !== 'none') || style.includes('stroke-dasharray')) msgs.push({ ruleId:'no-dashed-strokes', severity:'info', message:`Heads up, fig-face! Dashed stroke on <${el.tagName}> may render inconsistently in CoreSVG`, suggestion:'Convert dashed strokes to individual path segments if rendering is incorrect', element:el.tagName });
      });
      return msgs;
    }
  },
  {
    id: 'no-namespaces',
    defaultSeverity: 'info',
    check(doc) {
      const msgs = [];
      const svg = doc.documentElement;
      if (!svg) return msgs;
      const allowed = new Set(['xmlns','xmlns:xlink','xmlns:svg']);
      const attrs = svg.attributes;
      for (let i = 0; i < attrs.length; i++) {
        if (attrs[i].name.startsWith('xmlns:') && !allowed.has(attrs[i].name)) msgs.push({ ruleId:'no-namespaces', severity:'info', message:`Just a fig-ment! Non-standard namespace "${attrs[i].name}" may cause issues in CoreSVG`, suggestion:`Remove the ${attrs[i].name} namespace declaration if not required`, element:'svg' });
      }
      return msgs;
    }
  },
  {
    id: 'no-color-profiles',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      const patterns = ['display-p3','adobe-rgb','prophoto-rgb','cmyk','icc-color'];
      const profiles = doc.getElementsByTagName('color-profile');
      for (let i = 0; i < profiles.length; i++) msgs.push({ ruleId:'no-color-profiles', severity:'error', message:'Looking a little unripe! <color-profile> detected; non-sRGB profiles cause color shifting', suggestion:'Force the color export profile to standard sRGB in your design tool', element:'color-profile' });
      walkElements(doc.documentElement, (el) => {
        for (let i = 0; i < el.attributes.length; i++) {
          const val = el.attributes[i].value.toLowerCase();
          for (const p of patterns) {
            if (val.includes(p)) { msgs.push({ ruleId:'no-color-profiles', severity:'error', message:`Looking a little unripe! "${p}" on <${el.tagName}> causes color shifting on device screens`, suggestion:'Force the color export profile to standard sRGB in your design tool', element:el.tagName }); break; }
          }
        }
      });
      return msgs;
    }
  },
  {
    id: 'no-media-queries',
    defaultSeverity: 'error',
    check(doc) {
      const msgs = [];
      const styles = doc.getElementsByTagName('style');
      for (let i = 0; i < styles.length; i++) {
        if ((styles[i].textContent || '').includes('@media')) msgs.push({ ruleId:'no-media-queries', severity:'error', message:"That's fig-ile thinking! @media queries are entirely ignored by CoreSVG — stuck on default variant", suggestion:'Split the graphic into separate light/dark assets and map them to an Xcode Image Set Asset Catalog', element:'style' });
      }
      return msgs;
    }
  },
  {
    id: 'no-opacity-stacks',
    defaultSeverity: 'warning',
    check(doc) {
      const msgs = [];
      const counter = { count: 0 };
      walkWithOpacityContext(doc.documentElement, false, counter);
      if (counter.count > 0) msgs.push({ ruleId:'no-opacity-stacks', severity:'warning', message:`Preserve the jam! ${counter.count} nested opacity layer(s) detected — triggers glitches and color bleeding in CoreSVG`, suggestion:'Flatten overlapping vector layers or apply explicit opacity attributes to individual path nodes', element:'svg' });
      return msgs;
    }
  }
];

function lint(content, filePath) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(content, 'image/svg+xml');
  const messages = [];
  for (const rule of rules) {
    const results = rule.check(doc);
    messages.push(...results);
  }
  return { filePath, messages };
}

// --- UI ---

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const previewGrid = document.getElementById('previewGrid');
const lintBtn = document.getElementById('lintBtn');
const resultsDiv = document.getElementById('results');

let files = [];

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles([...e.dataTransfer.files].filter(f => f.name.endsWith('.svg')));
});
fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

function addFiles(newFiles) {
  const existing = new Set(files.map(f => f.name));
  for (const f of newFiles) {
    if (!existing.has(f.name)) { files.push(f); existing.add(f.name); }
  }
  render();
}

function removeFile(name) {
  files = files.filter(f => f.name !== name);
  render();
}

function clearAll() {
  files = [];
  resultsDiv.innerHTML = '';
  render();
}

function render() {
  lintBtn.disabled = files.length === 0;
  fileList.innerHTML = files.map(f =>
    '<div class="file-chip"><span>' + esc(f.name) + '</span><span class="remove" onclick="removeFile(\'' + esc(f.name) + '\')">×</span></div>'
  ).join('') + (files.length > 0 ? '<div class="file-chip clear-all" onclick="clearAll()">Clear all</div>' : '');
  previewGrid.innerHTML = files.map(f => {
    const url = URL.createObjectURL(f);
    return '<div class="preview-item"><img src="' + url + '" alt="' + esc(f.name) + '"><span class="name">' + esc(f.name) + '</span></div>';
  }).join('');
}

let fileContents = {};

lintBtn.addEventListener('click', async () => {
  lintBtn.disabled = true;
  lintBtn.textContent = 'Checking...';
  fileContents = {};
  const results = [];
  for (const f of files) {
    const content = await f.text();
    fileContents[f.name] = content;
    results.push(lint(content, f.name));
  }
  renderResults(results);
  lintBtn.disabled = false;
  lintBtn.textContent = 'Check compatibility';
});

let fixedContents = {};

function fixSvgClient(content) {
  const applied = [];
  const parser = new DOMParser();
  const doc = parser.parseFromString(content, 'image/svg+xml');
  const svg = doc.documentElement;
  const allowedNs = new Set(['xmlns', 'xmlns:xlink', 'xmlns:svg']);
  const nsToRemove = [];
  for (let i = 0; i < svg.attributes.length; i++) {
    const attr = svg.attributes[i];
    if (attr.name.startsWith('xmlns:') && !allowedNs.has(attr.name)) nsToRemove.push(attr.name);
  }
  for (const name of nsToRemove) { svg.removeAttribute(name); applied.push('Removed namespace: ' + name); }
  const removeTags = ['style', 'script', 'animate', 'animateTransform', 'animateMotion', 'set'];
  for (const tag of removeTags) {
    const els = [...doc.querySelectorAll(tag)];
    for (const el of els) { el.remove(); applied.push('Removed <' + tag + '> element'); }
  }
  doc.querySelectorAll('[style]').forEach(el => {
    const style = el.getAttribute('style');
    if (style && !style.includes('var(') && !style.includes('calc(')) {
      const props = style.split(';').map(s => s.trim()).filter(Boolean);
      let inlined = 0;
      for (const prop of props) {
        const [name, ...valParts] = prop.split(':');
        if (name && valParts.length > 0) { el.setAttribute(name.trim(), valParts.join(':').trim()); inlined++; }
      }
      if (inlined > 0) { el.removeAttribute('style'); applied.push('Inlined ' + inlined + ' style properties on <' + el.tagName + '>'); }
    }
  });
  const serializer = new XMLSerializer();
  const fixed = serializer.serializeToString(doc);
  return { fixed, applied };
}

async function fixFile(filePath) {
  const file = files.find(f => f.name === filePath);
  if (!file) return;
  const content = await file.text();
  const { fixed, applied } = fixSvgClient(content);
  const remaining = lint(fixed, filePath).messages;
  fixedContents[filePath] = fixed;
  const baseId = 'code-' + btoa(filePath).replace(/[^a-z0-9]/gi, '');
  const fixContainer = document.getElementById('fix-' + btoa(filePath).replace(/[^a-z0-9]/gi, ''));
  if (!fixContainer) return;
  const resultFile = fixContainer.closest('.result-file');
  // Disable the fix button
  const fixBtn = resultFile.querySelector('[data-fix-btn]');
  if (fixBtn) { fixBtn.disabled = true; fixBtn.textContent = 'Fixed'; }
  if (applied.length === 0) {
    fixContainer.innerHTML = '<p style="color:var(--success);margin:0.5rem 0;font-size:0.875rem;">No fixes needed</p>';
    fixContainer.style.display = 'block';
    return;
  }
  // Populate fixed code
  const fixedCodeEl = document.getElementById(baseId + '-fixed');
  if (fixedCodeEl) {
    fixedCodeEl.querySelector('pre').innerHTML = highlightSvg(formatXml(fixed), []);
  }
  // Show code wrapper with fixed view
  const wrapper = resultFile.querySelector('.code-wrapper');
  if (wrapper) wrapper.style.display = '';
  const origEl = document.getElementById(baseId + '-orig');
  if (origEl) origEl.style.display = 'none';
  if (fixedCodeEl) fixedCodeEl.style.display = '';
  // Hide "Show SVG code" in action row, show "Show original" toggle
  const showCodeBtn = [...resultFile.querySelectorAll('.action-row button')].find(b => b.textContent === 'Show SVG code');
  if (showCodeBtn) showCodeBtn.style.display = 'none';
  const toggleBtn = resultFile.querySelector('[data-toggle-id]');
  if (toggleBtn) { toggleBtn.style.display = ''; toggleBtn.textContent = 'Show original'; }
  // Build fix results + download button below code
  let html = '<p style="margin:0.75rem 0 0.25rem;font-size:0.875rem;font-weight:600;color:var(--success);">✓ Fixed:</p>';
  html += '<ul style="margin:0.25rem 0 0;padding-left:1.25rem;color:var(--on-surface-medium);font-size:0.875rem;">';
  for (const a of applied) { html += '<li style="margin:0.25rem 0;">' + esc(a) + '</li>'; }
  html += '</ul>';
  if (remaining.length > 0) {
    html += '<p style="margin:0.75rem 0 0.25rem;font-size:0.875rem;font-weight:600;color:var(--warning);">⚠ Remaining issues (require manual fix):</p>';
    html += '<ul style="margin:0.25rem 0 0;padding-left:1.25rem;color:var(--on-surface-medium);font-size:0.875rem;">';
    for (const m of remaining) {
      const icon = m.severity === 'error' ? '✖' : m.severity === 'warning' ? '⚠' : 'ℹ';
      html += '<li style="margin:0.25rem 0;"><span style="color:var(--' + m.severity + ')">' + icon + '</span> ' + esc(m.message.split(/(?<=!) /)[0]) + ' <span style="opacity:0.7;">(' + esc(m.ruleId) + ')</span></li>';
    }
    html += '</ul>';
  } else {
    html += '<p style="margin:0.75rem 0 0;font-size:0.875rem;color:var(--success);">✓ All issues resolved</p>';
  }
  html += '<div style="margin-top:0.75rem;"><button class="btn btn-secondary" style="margin-top:0;" onclick="downloadFixed(\'' + esc(filePath) + '\')">Download fixed SVG</button></div>';
  fixContainer.innerHTML = html;
  fixContainer.style.display = 'block';
}

function downloadFixed(filePath) {
  const content = fixedContents[filePath];
  if (!content) return;
  const blob = new Blob([content], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filePath; a.click();
  URL.revokeObjectURL(url);
}

function toggleCodeView(id) {
  const origEl = document.getElementById(id + '-orig');
  const fixedEl = document.getElementById(id + '-fixed');
  const btn = document.querySelector('[data-toggle-id="' + id + '"]');
  if (!fixedEl || !origEl) return;
  if (fixedEl.style.display === 'none') {
    fixedEl.style.display = 'block';
    origEl.style.display = 'none';
    btn.textContent = 'Show original';
  } else {
    fixedEl.style.display = 'none';
    origEl.style.display = 'block';
    btn.textContent = 'Show fixed';
  }
}

function renderResults(results) {
  let totalE = 0, totalW = 0, totalI = 0;
  const clean = results.filter(r => r.messages.length === 0);
  const issues = results.filter(r => r.messages.length > 0);
  let html = '';
  for (const r of clean) {
    const id = 'code-' + btoa(r.filePath).replace(/[^a-z0-9]/gi, '');
    html += '<div class="result-file clean"><div class="result-header"><h3><span class="check">✓</span> ' + esc(r.filePath) + '</h3></div>';
    html += '<div style="margin-top:0.5rem;"><button class="btn btn-secondary" style="margin-top:0;" onclick="toggleCode(\'' + id + '\')">Show SVG code</button></div>';
    html += '<div class="code-block" id="' + id + '" style="display:none;" data-file="' + esc(r.filePath) + '"><button class="btn-copy" onclick="copyCode(this)"><svg viewBox="0 0 16 16"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/></svg>Copy</button><pre>' + highlightSvg(formatXml(fileContents[r.filePath] || ''), []) + '</pre></div>';
    html += '</div>';
  }
  for (const r of issues) {
    const msgs = r.messages;
    const e = msgs.filter(m => m.severity === 'error').length;
    const w = msgs.filter(m => m.severity === 'warning').length;
    const i = msgs.filter(m => m.severity === 'info').length;
    totalE += e; totalW += w; totalI += i;
    const id = 'code-' + btoa(r.filePath).replace(/[^a-z0-9]/gi, '');
    const fixId = 'fix-' + btoa(r.filePath).replace(/[^a-z0-9]/gi, '');
    html += '<div class="result-file">';
    html += '<div class="result-header"><h3>' + esc(r.filePath) + '</h3></div>';
    for (const m of msgs) {
      const icon = m.severity === 'error' ? '✖' : m.severity === 'warning' ? '⚠' : 'ℹ';
      html += '<div class="msg">';
      const msgParts = m.message.split(/(?<=!) /);
      const pun = msgParts.length > 1 ? msgParts[0] : '';
      const detail = msgParts.length > 1 ? msgParts.slice(1).join(' ') : m.message;
      html += '<p class="msg-error"><span class="severity ' + m.severity + '">' + icon + '</span><strong>' + esc(pun) + '</strong> ' + esc(detail) + '</p>';
      html += '<p class="msg-rule"><strong>Rule:</strong> ' + esc(m.ruleId) + '</p>';
      if (m.suggestion) html += '<p class="msg-suggestion"><strong>Suggested fix:</strong> ' + esc(m.suggestion) + '</p>';
      html += '</div>';
    }
    html += '<div class="action-row" style="display:flex;margin-top:0.75rem;align-items:center;justify-content:space-between;">';
    html += '<button class="btn btn-secondary" style="margin-top:0;" data-fix-btn onclick="fixFile(\'' + esc(r.filePath) + '\')">Fix issues</button>';
    html += '<button class="btn btn-secondary" style="margin-top:0;" onclick="toggleCode(\'' + id + '\')">Show SVG code</button>';
    html += '</div>';
    html += '<div class="code-wrapper" style="display:none;">';
    html += '<div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-bottom:0.5rem;">';
    html += '<button class="btn btn-secondary" style="margin-top:0;display:none;" data-toggle-id="' + id + '" onclick="toggleCodeView(\'' + id + '\')">Show original</button>';
    html += '<button class="btn btn-secondary" style="margin-top:0;" onclick="toggleCode(\'' + id + '\')">Hide SVG code</button>';
    html += '</div>';
    html += '<div class="code-block" id="' + id + '-orig" data-file="' + esc(r.filePath) + '"><button class="btn-copy" onclick="copyCode(this)"><svg viewBox="0 0 16 16"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/></svg>Copy</button><pre>' + highlightSvg(formatXml(fileContents[r.filePath] || ''), msgs.map(m => ({element: m.element || '', severity: m.severity}))) + '</pre></div>';
    html += '<div class="code-block" id="' + id + '-fixed" style="display:none;" data-file="' + esc(r.filePath) + '"><button class="btn-copy" onclick="copyCode(this)"><svg viewBox="0 0 16 16"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/></svg>Copy</button><pre></pre></div>';
    html += '</div>';
    html += '<div id="' + fixId + '" style="display:none;"></div>';
    html += '</div>';
  }
  const total = totalE + totalW + totalI;
  let summary = '';
  if (total === 0) { summary = '<span class="clean">No doubt about it — all files are fig-tastic ✓</span>'; }
  else {
    const parts = [];
    if (totalE) parts.push('<span class="errors">' + totalE + ' error' + (totalE !== 1 ? 's' : '') + '</span>');
    if (totalW) parts.push('<span class="warnings">' + totalW + ' warning' + (totalW !== 1 ? 's' : '') + '</span>');
    if (totalI) parts.push('<span class="infos">' + totalI + ' info</span>');
    summary = parts.join(', ') + ' across ' + results.length + ' file' + (results.length !== 1 ? 's' : '');
  }
  resultsDiv.innerHTML = '<div class="summary">' + summary + '</div>' + html;
}

function toggleCode(id) {
  const origEl = document.getElementById(id) || document.getElementById(id + '-orig');
  if (!origEl) return;
  const resultFile = origEl.closest('.result-file');
  const wrapper = resultFile.querySelector('.code-wrapper');
  const actionBtn = [...resultFile.querySelectorAll('.action-row button')].find(b => b.textContent === 'Show SVG code');
  if (wrapper) {
    if (wrapper.style.display === 'none') {
      wrapper.style.display = '';
      if (actionBtn) actionBtn.style.display = 'none';
    } else {
      wrapper.style.display = 'none';
      if (actionBtn) actionBtn.style.display = '';
    }
  } else {
    if (origEl.style.display === 'none') { origEl.style.display = ''; }
    else { origEl.style.display = 'none'; }
  }
}

function copyCode(btn) {
  const block = btn.closest('.code-block');
  const filename = block.getAttribute('data-file');
  const raw = fileContents[filename] || block.querySelector('pre').textContent;
  navigator.clipboard.writeText(raw).then(() => {
    btn.innerHTML = '<svg viewBox="0 0 16 16"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>Copied';
    setTimeout(() => { btn.innerHTML = '<svg viewBox="0 0 16 16"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/></svg>Copy'; }, 2000);
  });
}

function formatXml(xml) {
  let formatted = '';
  let indent = 0;
  const parts = xml.replace(/>\s*</g, '>\n<').split('\n');
  for (let part of parts) {
    part = part.trim();
    if (!part) continue;
    if (part.startsWith('</')) indent = Math.max(0, indent - 1);
    formatted += '  '.repeat(indent) + part + '\n';
    if (part.startsWith('<') && !part.startsWith('</') && !part.startsWith('<?') && !part.endsWith('/>') && !part.includes('</')) indent++;
  }
  return formatted.trim();
}

function highlightSvg(code, flaggedElements) {
  const lines = code.split('\n');
  return lines.map(line => {
    let highlighted = esc(line)
      .replace(/(&lt;\/?)([\w:-]+)/g, '<span class="bracket">$1</span><span class="tag">$2</span>')
      .replace(/(\/?&gt;)/g, '<span class="bracket">$1</span>')
      .replace(/([\w:-]+)=(&quot;[^&]*?&quot;)/g, '<span class="attr">$1</span>=<span class="val">$2</span>');
    let lineClass = 'line';
    if (flaggedElements && flaggedElements.length > 0) {
      const rawLine = line.trim();
      for (const f of flaggedElements) {
        if (f.element && (rawLine.match(new RegExp('<' + f.element + '[\\s>/]')) || rawLine.match(new RegExp('</' + f.element + '>')))) {
          lineClass += f.severity === 'error' ? ' error-line' : ' warning-line';
          break;
        }
      }
    }
    return '<span class="' + lineClass + '">' + highlighted + '</span>';
  }).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

const themeToggle = document.getElementById('themeToggle');
if (localStorage.getItem('figgity-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
themeToggle.addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('figgity-theme', 'dark'); }
  else { document.documentElement.setAttribute('data-theme', 'light'); localStorage.setItem('figgity-theme', 'light'); }
});
</script>
